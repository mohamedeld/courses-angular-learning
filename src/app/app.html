<section class="min-h-screen bg-slate-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <!-- Page Header -->
    <div class="mb-10 text-center">
      <span
        class="mb-3 inline-block rounded-full bg-violet-100 px-4 py-1.5 text-sm font-semibold text-violet-700"
      >
        Expand Your Skills
      </span>

      <h1 class="mb-4 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">
        Explore Our Courses
      </h1>

      <p class="mx-auto max-w-2xl text-base leading-7 text-slate-600">
        Learn Angular, TypeScript, RxJS and more with practical, developer-focused courses.
      </p>
    </div>

    <!-- Courses Grid -->
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      @for (course of courses; track course.id) {
        <app-course-card #card [course]="course" (viewCourse)="onViewCourse($event)" />
      }
    </div>
  </div>

  <app-payment-container>
    <app-wallet />
  </app-payment-container>
  <p appHighlight>Welcom</p>
</section>
