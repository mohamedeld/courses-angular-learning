<article
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-violet-200 hover:shadow-xl"
>
  <!-- Course Image -->
  <div class="relative h-48 overflow-hidden bg-slate-50">
    <img
      [ngSrc]="course().iconUrl"
      [alt]="course().description"
      fill
      sizes="(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 25vw"
      class="object-contain p-5 transition-transform duration-300 group-hover:scale-105"
    />

    <!-- Category Badge -->
    <span
      class="absolute left-4 top-4 z-10 rounded-full px-3 py-1 text-xs font-bold"
      [class.bg-emerald-100]="course().category === 'BEGINNER'"
      [class.text-emerald-700]="course().category === 'BEGINNER'"
      [class.bg-amber-100]="course().category === 'INTERMEDIATE'"
      [class.text-amber-700]="course().category === 'INTERMEDIATE'"
      [class.bg-violet-100]="course().category === 'ADVANCED'"
      [class.text-violet-700]="course().category === 'ADVANCED'"
    >
      {{ course().category }}
    </span>
  </div>

  <!-- Course Content -->
  <div class="flex flex-1 flex-col p-5">
    <div class="mb-3 flex items-center justify-between gap-3">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">
        Course #{{ course().id }}
      </span>

      @if (course().lessonsCount !== undefined) {
        <span class="flex items-center gap-1.5 text-sm text-slate-500">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.7"
            stroke="currentColor"
            class="h-4 w-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6l4 2m6-2a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z"
            />
          </svg>

          {{ course().lessonsCount }} lessons
        </span>
      }
    </div>

    <h2
      class="mb-3 text-xl font-bold leading-snug text-slate-900 transition-colors group-hover:text-violet-700"
    >
      {{ course().description }}
    </h2>

    <p class="mb-6 line-clamp-3 flex-1 text-sm leading-6 text-slate-600">
      {{ course().longDescription }}
    </p>

    <!-- Footer -->
    <div class="mt-auto border-t border-slate-100 pt-4">
      <button
        type="button"
        (click)="onViewCourse()"
        class="flex w-full items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 py-3 text-sm font-semibold text-white transition-colors hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2"
      >
        View Course

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="h-4 w-4 transition-transform group-hover:translate-x-1"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>
</article>
